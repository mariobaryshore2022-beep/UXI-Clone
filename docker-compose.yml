services:
  postgres:
    image: postgres:16-alpine
    container_name: uxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uxi
      POSTGRES_PASSWORD: uxipassword
      POSTGRES_DB: uxi_db
    ports:
      - "5432:5432"
    volumes:
      - uxi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uxi -d uxi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: uxi-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://uxi:uxipassword@postgres:5432/uxi_db
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  uxi_pg_data:
